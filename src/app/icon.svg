<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="sealGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8a1c1c" />
      <stop offset="60%" stop-color="#400a0c" />
      <stop offset="100%" stop-color="#240405" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="50%" stop-color="#c9a24b" />
      <stop offset="100%" stop-color="#8c6a23" />
    </linearGradient>
  </defs>

  <!-- Wax Seal Outer Ring -->
  <circle cx="50" cy="50" r="46" fill="url(#sealGrad)" stroke="url(#goldGrad)" stroke-width="3.5" />
  <circle cx="50" cy="50" r="39" fill="none" stroke="#c9a24b" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.8" />

  <!-- Feather Quill & Ink Icon -->
  <g transform="translate(23, 20) scale(1.15)">
    <!-- Feather Nib -->
    <path d="M 38 4 C 20 12, 12 28, 6 42 C 16 38, 26 34, 30 26 C 26 34, 18 42, 12 48 C 22 46, 32 40, 36 32 Z" fill="url(#goldGrad)" />
    <!-- Feather Spine -->
    <path d="M 38 4 Q 22 28 4 48" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
    <!-- Inkwell Base -->
    <path d="M 2 46 L 8 46 L 6 52 L 0 52 Z" fill="url(#goldGrad)" />
  </g>
</svg>
